name: Shared Docker Build and Publish

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      context:
        required: false
        type: string
        default: .
    outputs:
      image_uri:
        description: "Published image URI"
        value: ${{ jobs.docker.outputs.image_uri }}
    secrets:
      registry_token:
        required: false

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tags
        id: vars
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_URI="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.image_name }}"
          TAG1="run-${GITHUB_RUN_NUMBER}"
          TAG2="sha-${SHORT_SHA}"

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "tag1=${TAG1}" >> "$GITHUB_OUTPUT"
          echo "tag2=${TAG2}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.registry_token || secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image_uri }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag1 }}
            type=raw,value=${{ steps.vars.outputs.tag2 }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export published image
        id: image
        shell: bash
        run: |
          echo "image_uri=${{ steps.vars.outputs.image_uri }}:${{ steps.vars.outputs.tag1 }}" >> "$GITHUB_OUTPUT"
